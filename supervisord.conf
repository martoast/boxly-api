[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:php]
; PHP's built-in server handles one request at a time unless it is told to fork
; workers, and Laravel only honours PHP_CLI_SERVER_WORKERS together with
; --no-reload. Without both, a single 10s web search blocks every other caller.
command=/usr/bin/php -d variables_order=EGPCS /var/www/html/artisan serve --host=0.0.0.0 --port=80 --no-reload
environment=PHP_CLI_SERVER_WORKERS="8"
user=sail
autostart=true
autorestart=true
priority=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:worker]
command=/usr/bin/php /var/www/html/artisan queue:work --queue=high,default
user=sail
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/www/html/worker.log

[program:scheduler]
command=/bin/sh -c "while [ true ]; do (/usr/bin/php /var/www/html/artisan schedule:run --verbose >> /dev/null 2>&1) & sleep 60; done"
user=sail
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/www/html/scheduler.log